apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: flagger-loadtester
  name: flagger-loadtester
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: flagger-loadtester
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        openservicemesh.io/inbound-port-exclusion-list: 80, 8080
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: flagger-loadtester
    spec:
      containers:
      - name: loadtester
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        command:
        - ./loadtester
        - -port=8080
        - -log-level=info
        - -timeout=1h
        image: ghcr.io/fluxcd/flagger-loadtester:0.39.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - wget
            - --quiet
            - --tries=1
            - --timeout=4
            - --spider
            - http://localhost:8080/healthz
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - wget
            - --quiet
            - --tries=1
            - --timeout=4
            - --spider
            - http://localhost:8080/healthz
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 10001
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30