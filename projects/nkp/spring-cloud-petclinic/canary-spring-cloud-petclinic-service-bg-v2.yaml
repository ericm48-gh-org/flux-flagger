---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: spring-cloud-petclinic-service-v2
spec:
  # service mesh provider can be: kubernetes, istio, appmesh, nginx, gloo
  provider: kubernetes
  # deployment reference
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spring-cloud-petclinic-service
  # the maximum time in seconds for the canary deployment
  # to make progress before rollback (default 600s)
  progressDeadlineSeconds: 60
  # HPA reference (optional)
  autoscalerRef:
    apiVersion: autoscaling/v2beta2
    kind: HorizontalPodAutoscaler
    name: spring-cloud-petclinic-service
  service:
    port: 8080
    portDiscovery: true
  analysis:
    # schedule interval (default 60s)
    interval: 30s
    # max number of failed checks before rollback
    threshold: 12
    # number of checks to run before rollback
    iterations: 10
    # Prometheus checks based on 
    # http_request_duration_seconds histogram
    metrics:
    # These metrics ARE BORK'D on NKP...why?
      # - name: request-success-rate
      #   # minimum req success rate (non 5xx responses)
      #   # percentage (0-100)
      #   thresholdRange:
      #     min: 99
      #   interval: 1m
      # - name: request-duration
      #   # maximum req duration P99
      #   # milliseconds
      #   thresholdRange:
      #     max: 500
      #   interval: 30s
    # acceptance/load testing hooks
    webhooks:
      # Start-Gate
      - name: start-gate
        type: confirm-rollout
        url: http://flagger-loadtester.test/gate/approve
        retries: 15         

      # Pre-rollout: acceptance test before routing any traffic
      - name: acceptance-test
        type: pre-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 30s
        metadata:
          type: bash
          cmd: "curl -s http://spring-cloud-petclinic-service-canary.test:8080/actuator/health | grep UP"

      # Rollout: generate load during the validation period
      - name: load-test
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 5s
        metadata:
          type: cmd
          cmd: "hey -z 1m -q 10 -c 2 http://spring-cloud-petclinic-service-canary.test:8080/"
          logCmdOutput: "true"

      # Post-rollout: run smoke tests after promotion
      - name: smoke-test
        type: post-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 30s
        metadata:
          type: bash
          cmd: "curl -s http://spring-cloud-petclinic-service.test:8080/actuator/health | grep UP"

      # - name: start-gate
      #   type: confirm-rollout
      #   url: http://flagger-loadtester.test/gate/approve
