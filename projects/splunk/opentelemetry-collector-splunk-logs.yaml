---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: splunk-logs
spec:
  mode: daemonset
  # splunk_hec is a contrib exporter and is NOT in the operator's default
  # collector image — pin the contrib distro (align the tag with your operator).
  image: otel/opentelemetry-collector-contrib:0.117.0
  serviceAccount: otel-logs-collector
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: SPLUNK_HEC_TOKEN
      valueFrom:
        secretKeyRef:
          name: splunk-hec
          key: token
    - name: SPLUNK_HEC_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: splunk-hec
          key: endpoint

  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true

  # run on every node, including control-plane (drop if you don't want that)
  tolerations:
    - operator: Exists

  config:
receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*_otel-collector-*_*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
            add_metadata_from_filepath: true
            # containerd on NKP; or omit this line entirely for auto-detection
            format: containerd

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
          labels:
            - tag_name: app
              key: app.kubernetes.io/name
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      resourcedetection:
        detectors: [env, system]
        system:
          hostname_sources: [os]
      resource:
        attributes:
          - key: k8s.cluster.name
            value: my-cluster
            action: upsert
      batch:
        send_batch_size: 8192
        timeout: 5s

    exporters:
      splunk_hec:
        token: "${env:SPLUNK_HEC_TOKEN}"
        endpoint: "${env:SPLUNK_HEC_ENDPOINT}"
        source: "kubernetes"
        sourcetype: "kube:container"
        index: "k8s_logs"
        #max_connections: 20
        tls:
          insecure_skip_verify: false
          # ca_file: /etc/otel/certs/splunk-ca.pem
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
          exporters: [splunk_hec]
      telemetry:
        logs:
          level: info